<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Daya Listrik</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <h2>Dashboard Pemantauan</h2>
  <h3 id="tanggal-header">Tanggal: </h3>

  <canvas id="arusChart" height="100"></canvas>
  <canvas id="teganganChart" height="100"></canvas>
  <canvas id="dayaChart" height="100"></canvas>

  <script>
    let dayaChart,arusChart,teganganChart;

    async function fetchData() {
      const response = await fetch('/data');
      const data = await response.json();

      const waktu = data.map(d => d.waktu); // ex: "2025-05-21 14:25:00"
      const daya = data.map(d => d.daya);
      const arus = data.map(d =>d.arus);
      const tegangan = data.map(d =>d.tegangan);

      // Update header tanggal
      if (waktu.length > 0) {
        const latestDate = waktu[0].split(' ')[0];
        document.getElementById("tanggal-header").textContent = "Tanggal: " + latestDate;
      }

      // Convert waktu ke objek Date agar bisa digunakan oleh time scale Chart.js 4
      const waktuDate = waktu.map(w => new Date(w));

      if (!dayaChart) {
        const dayaDoc = document.getElementById('dayaChart').getContext('2d');
        dayaChart = new Chart(dayaDoc, {
          type: 'line',
          data: {
            labels: waktuDate,
            datasets: [{
              label: 'Daya (W)',
              data: daya,
              borderColor: 'red',
              tension: 0.3,
              fill: false
            }]
          },
          options: {
            responsive: true,
            scales: {
              x: {
                type: 'time',
                time: {
                  unit: 'minute',
                  displayFormats: {
                    minute: 'HH:mm'
                  }
                },
                title: {
                  display: true,
                  text: 'Waktu (Jam:Menit)'
                }
              },
              y: {
                title: {
                  display: true,
                  text: 'Daya (Watt)'
                },
                beginAtZero: true
              }
            },
            plugins: {
              legend: {
                display: true
              },
              tooltip: {
                mode: 'index',
                intersect: false
              }
            }
          }
        });const arusDoc = document.getElementById('arusChart').getContext('2d');
        arusChart = new Chart(arusDoc, {
          type: 'line',
          data: {
            labels: waktuDate,
            datasets: [{
              label: 'Arus (A)',
              data: arus,
              borderColor: 'blue',
              tension: 0.3,
              fill: false
            }]
          },
          options: {
            responsive: true,
            scales: {
              x: {
                type: 'time',
                time: {
                  unit: 'minute',
                  displayFormats: {
                    minute: 'HH:mm'
                  }
                },
                title: {
                  display: true,
                  text: 'Waktu (Jam:Menit)'
                }
              },
              y: {
                title: {
                  display: true,
                  text: 'Arus (A)'
                },
                beginAtZero: true
              }
            },
            plugins: {
              legend: {
                display: true
              },
              tooltip: {
                mode: 'index',
                intersect: false
              }
            }
          }
        });const teganganDoc = document.getElementById('teganganChart').getContext('2d');
        teganganChart = new Chart(teganganDoc, {
          type: 'line',
          data: {
            labels: waktuDate,
            datasets: [{
              label: 'Tegangan (V)',
              data: tegangan,
              borderColor: 'green',
              tension: 0.3,
              fill: false
            }]
          },
          options: {
            responsive: true,
            scales: {
              x: {
                type: 'time',
                time: {
                  unit: 'minute',
                  displayFormats: {
                    minute: 'HH:mm'
                  }
                },
                title: {
                  display: true,
                  text: 'Waktu (Jam:Menit)'
                }
              },
              y: {
                title: {
                  display: true,
                  text: 'Tegangan (Volt)'
                },
                beginAtZero: true
              }
            },
            plugins: {
              legend: {
                display: true
              },
              tooltip: {
                mode: 'index',
                intersect: false
              }
            }
          }
        });
      } else {
        dayaChart.data.labels = waktuDate;
        dayaChart.data.datasets[0].data = daya;
        dayaChart.update();

        arusChart.data.labels = waktu;
        arusChart.data.datasets[0].data = arus;
        arusChart.update();

        teganganChart.data.labels = waktu;
        teganganChart.data.datasets[0].data = tegangan;
        teganganChart.update();
      }
    }

    fetchData();                // Panggil saat pertama kali
    setInterval(fetchData, 5000); // Update tiap 10 detik
  </script>
</body>
</html>
